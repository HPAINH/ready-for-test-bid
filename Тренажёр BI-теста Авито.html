<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажёр BI-теста Авито</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap&subset=cyrillic">
<style>
/* Layout: a working desk — slim top nav, one wide work surface per view, Hirety-style two-pane question cards */
:root {
  --paper: #EEF2F4;
  --card: #FFFFFF;
  --ink: #13212B;
  --muted: #5A6B77;
  --line: #D3DCE2;
  --accent: #0E6B58;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE9;
  --warn: #A86512;
  --good: #1D7F47;
  --good-soft: #DDF2E5;
  --bad: #B83A32;
  --bad-soft: #F8E1DE;
  --mid: #A86512;
  --mid-soft: #F6EAD6;
  --code-bg: #F3F6F8;
  --f-display: 'Unbounded', 'Manrope', system-ui, sans-serif;
  --f-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1418; --card: #151E24; --ink: #E3EBF0; --muted: #8FA1AD; --line: #27343C;
    --accent: #3BC3A0; --accent-ink: #062019; --accent-soft: #143A31; --warn: #E2A452;
    --good: #4CC983; --good-soft: #15352A; --bad: #F07B70; --bad-soft: #3D1F1D; --mid: #E2A452; --mid-soft: #3A2C17; --code-bg: #10181D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1418; --card: #151E24; --ink: #E3EBF0; --muted: #8FA1AD; --line: #27343C;
  --accent: #3BC3A0; --accent-ink: #062019; --accent-soft: #143A31; --warn: #E2A452;
  --good: #4CC983; --good-soft: #15352A; --bad: #F07B70; --bad-soft: #3D1F1D; --mid: #E2A452; --mid-soft: #3A2C17; --code-bg: #10181D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.shell { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
header.top .shell { display: flex; align-items: center; gap: 18px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-family: var(--f-mono); font-size: 11px; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.nav button { font: 600 14px var(--f-body); color: var(--muted); background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.nav button:hover { color: var(--ink); background: var(--paper); }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
main { padding-block: 24px 64px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -0.02em; }
h2 { font-family: var(--f-display); font-weight: 500; font-size: 21px; letter-spacing: -0.01em; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.eyebrow { font: 600 12px var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.lead { color: var(--muted); font-size: 16px; max-width: 64ch; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
.note { color: var(--muted); font-size: 14px; max-width: 80ch; }
.row { display: flex; align-items: center; }
.gap { gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.sec { margin: 34px 0 14px; }
.btn { font: 600 14px var(--f-body); border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 9px 16px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn.big { padding: 13px 26px; font-size: 16px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link.danger { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { font: 600 11px var(--f-mono); padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--paper); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.mid { background: var(--mid-soft); color: var(--mid); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

/* plan */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: end; }
.hero > div:first-child { display: flex; flex-direction: column; gap: 14px; }
.countdown { display: grid; gap: 10px; }
.cd { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; display: flex; align-items: baseline; gap: 14px; }
.cd .num { font: 700 30px var(--f-display); font-variant-numeric: tabular-nums; min-width: 2.6ch; color: var(--accent); }
.cd .lbl { color: var(--muted); font-size: 14px; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.topic { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; font: inherit; color: inherit; }
.topic:hover { border-color: var(--accent); }
.t-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.t-name { font-weight: 700; }
.t-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: block; height: 6px; background: var(--paper); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--muted); border-radius: 99px; }
.bar > span.good { background: var(--good); } .bar > span.mid { background: var(--mid); } .bar > span.bad { background: var(--bad); }
.topics + .note { margin-top: 10px; }
.days { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.day { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; align-items: start; }
.day.done { opacity: 0.62; }
.day.done .d-title { text-decoration: line-through; text-decoration-color: var(--muted); }
.d-date { font: 600 13px var(--f-mono); color: var(--accent); padding-top: 2px; }
.d-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.d-title { font-weight: 700; font-size: 16px; }
.d-goal { color: var(--muted); font-size: 14px; }
.d-topics { display: flex; gap: 6px; flex-wrap: wrap; }
.check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.reset { margin-top: 30px; font-size: 13px; color: var(--muted); }
.tablewrap { overflow-x: auto; max-width: 100%; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; background: var(--card); }
table.data th, table.data td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th { font: 600 12px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.barcell { width: 40%; min-width: 120px; }

/* theory / split views */
.split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 16px; }
.side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 100px); overflow-y: auto; }
.side-item { display: flex; justify-content: space-between; gap: 8px; align-items: center; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 8px; cursor: pointer; font: 500 14px var(--f-body); color: var(--ink); }
.side-item:hover { background: var(--card); }
.side-item[aria-current="true"] { background: var(--card); box-shadow: inset 3px 0 0 var(--accent); font-weight: 700; }
.minw { min-width: 0; }
.prose { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 24px 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.prose h3 { margin-top: 12px; }
.prose ul, .prose ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.formula { font-family: var(--f-mono); font-size: 14px; background: var(--accent-soft); color: var(--ink); padding: 10px 14px; border-radius: 8px; overflow-x: auto; }
.ex { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
.ex b { color: var(--ink); }
table.mini { border-collapse: collapse; font-size: 14px; margin: 4px 0; font-variant-numeric: tabular-nums; }
table.mini th, table.mini td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
table.mini th { background: var(--paper); font-weight: 600; }
.prose table.mini { display: block; overflow-x: auto; max-width: 100%; }
code, pre { font-family: var(--f-mono); font-size: 13px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0; white-space: pre; }
.viewhead { display: flex; flex-direction: column; gap: 6px; }
.viewhead p { max-width: 90ch; font-size: 14px; }

/* training */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 13px var(--f-body); border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; border-radius: 99px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.session { display: flex; gap: 18px; margin: 14px 0 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.session b { color: var(--ink); }
.qcard, .codecard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.qbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); gap: 12px; }
.qlabel { font: 600 13px var(--f-mono); color: var(--muted); }
.timer { font: 600 14px var(--f-mono); font-variant-numeric: tabular-nums; background: var(--good-soft); color: var(--good); padding: 4px 10px; border-radius: 8px; }
.timer.low { background: var(--mid-soft); color: var(--mid); }
.timer.over { background: var(--bad-soft); color: var(--bad); }
.qgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.qtext { padding: 22px 24px; display: flex; flex-direction: column; gap: 10px; min-width: 0; border-right: 1px solid var(--line); }
.qq { font-size: 18px; font-weight: 600; line-height: 1.45; }
.qtype { font-size: 12px; color: var(--muted); }
.qopts { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.olabel { font: 600 12px var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer; background: var(--card); }
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .key { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 600 11px var(--f-mono); color: var(--muted); margin-top: 1px; }
.opt input[type="checkbox"] + .key { border-radius: 5px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .otext { min-width: 0; overflow-wrap: anywhere; }
.opt.code .otext { font-family: var(--f-mono); font-size: 13px; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); border-color: var(--good); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt.locked { cursor: default; }
.errbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bad); color: #fff; font: 13px var(--f-mono); padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); white-space: pre-wrap; }
.hint { font-size: 12px; color: var(--muted); }
.feedback { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 14px; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.expl { font-size: 14px; line-height: 1.6; }
[hidden] { display: none !important; }
.expl ul.why { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.feedback .next { align-self: flex-start; }
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }

/* code */
.cgrid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
.cstate { padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--line); min-width: 0; }
.ceditor { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; background: var(--paper); }
.edhead { display: flex; justify-content: space-between; font: 600 12px var(--f-mono); color: var(--muted); gap: 8px; }
.editor { width: 100%; min-height: 300px; resize: vertical; font: 13px/1.55 var(--f-mono); background: var(--code-bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; tab-size: 4; white-space: pre; overflow: auto; }
.editor.sql { min-height: 150px; }
.editor:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.tcase .io, .tres .io { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; font-size: 12px; align-items: start; }
.io span { color: var(--muted); padding-top: 6px; }
.io pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 0; overflow-x: auto; white-space: pre; }
pre.err { color: var(--bad); white-space: pre-wrap; background: var(--bad-soft); border: 0; padding: 8px 10px; border-radius: 6px; margin: 0; }
.results { display: flex; flex-direction: column; gap: 8px; }
.tres { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card); display: flex; flex-direction: column; gap: 6px; }
.tres.ok .tname { color: var(--good); } .tres.no .tname { color: var(--bad); }
.tname { font: 600 12px var(--f-mono); }
.refsol { display: flex; flex-direction: column; gap: 8px; }
.hintbox summary, .schema summary, details summary { cursor: pointer; font-weight: 600; }
.schema { margin: 14px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.schema[open] summary { margin-bottom: 10px; }
.sqlcard { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.sqlmsg, .sqlout { display: flex; flex-direction: column; gap: 8px; }

/* exam */
.examstart, .examres { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.facts { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; width: 100%; }
.facts li { background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.facts b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 18px; font-weight: 500; }
.eprog { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; font: 600 13px var(--f-mono); color: var(--muted); flex-wrap: wrap; }
.ebar { flex: 1; min-width: 120px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.ebar span { display: block; height: 100%; background: var(--accent); }
.leave { background: var(--mid-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
.score { display: flex; align-items: baseline; gap: 8px; }
.score .big { font: 700 72px/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.score .of { font: 500 24px var(--f-display); color: var(--muted); }
.examres .tablewrap { width: 100%; }
.review { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; width: 100%; }
.review > li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; border-left: 3px solid var(--good); }
.review > li.no { border-left-color: var(--bad); }
.review summary { font-weight: 500; font-size: 14px; }
.review details[open] { display: flex; flex-direction: column; gap: 10px; }
.review details[open] summary { margin-bottom: 8px; }
.rnum { font: 600 12px var(--f-mono); color: var(--muted); margin-right: 4px; }
ul.ans { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 4px; font-size: 14px; }
ul.ans li { padding: 6px 10px; border-radius: 6px; background: var(--paper); overflow-wrap: anywhere; }
ul.ans li.right { background: var(--good-soft); color: var(--good); font-weight: 600; }
ul.ans li.wrong { background: var(--bad-soft); color: var(--bad); }

@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; }
  .qgrid, .cgrid { grid-template-columns: 1fr; }
  .qtext, .cstate { border-right: 0; border-bottom: 1px solid var(--line); }
  .split { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; flex-direction: row; overflow-x: auto; }
  .side-item { white-space: nowrap; }
  .day { grid-template-columns: 1fr; gap: 8px; }
  .prose { padding: 18px; }
  .examstart, .examres { padding: 20px; }
}
@media (max-width: 480px) {
  .qtext, .qopts, .cstate { padding: 16px; }
  .qq { font-size: 16px; }
  .brand span.full { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .qcard, .codecard { animation: rise 0.18s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}

/* charts */
.chart { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px; max-width: 100%; }
.chart svg { width: 100%; height: auto; display: block; font-family: var(--f-body); }
.ch-title { fill: var(--ink); font-size: 13px; font-weight: 700; }
.ch-txt { fill: var(--muted); font-size: 11px; }
.ch-val { fill: var(--ink); font-size: 11px; font-weight: 600; }
.ch-seg { fill: #10202A; font-size: 8.5px; font-weight: 600; }
.ch-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.ch-axis { stroke: var(--muted); stroke-width: 1; }
.ch-line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.ch-dot { fill: var(--accent); }
.duo { display: grid; grid-template-columns: minmax(0, 0.55fr) minmax(0, 1.45fr); gap: 10px; align-items: start; }
.qtext .tablewrap table.mini { font-size: 13px; }
.variant > li { display: grid; gap: 4px; }
.vq { font-weight: 600; }
.va { color: var(--good); font-weight: 600; }
.vw { font-size: 14px; }
#v-variant { display: flex; flex-direction: column; gap: 16px; }

ntact', '2026-10-04 13:30');\nINSERT INTO raw_events VALUES (52, 15, 'favorite', '2026-10-04 22:15');\nINSERT INTO raw_events VALUES (53, 15, 'search', '2026-10-11 22:00');\nINSERT INTO raw_events VALUES (54, 15, 'view', '2026-10-08 18:15');\nINSERT INTO raw_events VALUES (49, 14, 'contact', '2026-10-11 15:30');\nINSERT INTO raw_events VALUES (17, 6, 'search', '2026-10-02 17:45');\nINSERT INTO raw_events VALUES (7, 3, 'favorite', '2026-10-06 10:45');\nINSERT INTO raw_events VALUES (44, 13, 'view', '2026-10-05 19:15');\nINSERT INTO raw_events VALUES (40, 12, 'view', '2026-10-06 14:45');\nINSERT INTO raw_events VALUES (19, 6, 'favorite', '2026-10-08 22:30');\nINSERT INTO raw_events VALUES (42, 12, 'view', '2026-10-18 21:45');\nINSERT INTO raw_events VALUES (14, 5, 'view', '2026-10-10 12:00');\nINSERT INTO raw_events VALUES (33, 11, 'favorite', '2026-10-20 10:30');", "tasks": [{"id": "b1", "level": 1, "title": "Выручка по категориям", "text": "Посчитайте выручку (SUM(amount)) по категориям товаров для оплаченных заказов (status = 'paid'): category, revenue.", "ref": "SELECT p.category, SUM(o.amount) AS revenue FROM fact_orders o JOIN dim_product p ON p.product_id = o.product_id WHERE o.status = 'paid' GROUP BY p.category;", "ordered": false, "hint": "JOIN fact_orders с dim_product, фильтр status в WHERE, GROUP BY category."}, {"id": "b2", "level": 1, "title": "Выручка по месяцам", "text": "Выведите месяц (формат ГГГГ-ММ) и выручку по оплаченным заказам, по возрастанию месяца. В SQLite месяц: strftime('%Y-%m', order_date); в PostgreSQL было бы DATE_TRUNC.", "ref": "SELECT strftime('%Y-%m', order_date) AS month, SUM(amount) AS revenue FROM fact_orders WHERE status = 'paid' GROUP BY month ORDER BY month;", "ordered": true, "hint": "GROUP BY по выражению месяца и ORDER BY month."}, {"id": "b3", "level": 1, "title": "NULL и LIKE", "text": "Найдите клиентов без email или с фамилией, начинающейся на «Пет» (фамилия — вторая часть name): customer_id, name.", "ref": "SELECT customer_id, name FROM dim_customer WHERE email IS NULL OR name LIKE '% Пет%';", "ordered": false, "hint": "IS NULL, а не = NULL. Фамилия идёт после пробела: шаблон '% Пет%'."}, {"id": "b4", "level": 1, "title": "Товары без продаж", "text": "Найдите товары, которые ни разу не заказывали: product_id, name.", "ref": "SELECT p.product_id, p.name FROM dim_product p LEFT JOIN fact_orders o ON o.product_id = p.product_id WHERE o.order_id IS NULL;", "ordered": false, "hint": "Анти-JOIN: LEFT JOIN + WHERE o.order_id IS NULL."}, {"id": "b5", "level": 2, "title": "Сколько уникальных событий", "text": "В raw_events есть полные дубли строк. Посчитайте число уникальных событий одним числом.", "ref": "SELECT COUNT(*) FROM (SELECT DISTINCT event_id, user_id, event_type, event_ts FROM raw_events);", "ordered": false, "hint": "DISTINCT в подзапросе, затем COUNT(*)."}, {"id": "b6", "level": 2, "title": "Найти дубли", "text": "Выведите event_id и число копий для событий, которые встречаются больше одного раза.", "ref": "SELECT event_id, COUNT(*) AS copies FROM raw_events GROUP BY event_id HAVING COUNT(*) > 1;", "ordered": false, "hint": "GROUP BY ключ + HAVING COUNT(*) > 1 — стандартная проверка качества данных."}, {"id": "b7", "level": 2, "title": "Первое событие пользователя", "text": "Для каждого пользователя оставьте одно самое раннее событие: user_id, event_type, event_ts (дубли не должны давать лишних строк).", "ref": "SELECT user_id, event_type, event_ts FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY event_ts, event_id) AS rn FROM raw_events) t WHERE rn = 1;", "ordered": false, "hint": "ROW_NUMBER в подзапросе, фильтр rn = 1 снаружи — в WHERE окно использовать нельзя."}, {"id": "b8", "level": 2, "title": "Клиенты с 3+ заказами", "text": "Выведите клиентов с тремя и более оплаченными заказами: customer_id, orders.", "ref": "SELECT customer_id, COUNT(*) AS orders FROM fact_orders WHERE status = 'paid' GROUP BY customer_id HAVING COUNT(*) >= 3;", "ordered": false, "hint": "WHERE для status, HAVING для числа заказов."}, {"id": "b9", "level": 2, "title": "Средний чек по сегментам", "text": "Средний чек (средний amount оплаченного заказа) по сегментам клиентов: segment, avg_check, округлить до целых.", "ref": "SELECT c.segment, ROUND(AVG(o.amount)) AS avg_check FROM fact_orders o JOIN dim_customer c ON c.customer_id = o.customer_id WHERE o.status = 'paid' GROUP BY c.segment;", "ordered": false, "hint": "JOIN с dim_customer, AVG, ROUND."}, {"id": "b10", "level": 3, "title": "Выручка прошлого месяца (LAG)", "text": "По оплаченным заказам: month, revenue и prev_revenue — выручка предыдущей строки по месяцу (LAG). Обратите внимание, что апреля в данных нет.", "ref": "WITH m AS (SELECT strftime('%Y-%m', order_date) AS month, SUM(amount) AS revenue FROM fact_orders WHERE status = 'paid' GROUP BY month) SELECT month, revenue, LAG(revenue) OVER (ORDER BY month) AS prev_revenue FROM m ORDER BY month;", "ordered": true, "hint": "CTE с помесячной выручкой, затем LAG(revenue) OVER (ORDER BY month). Для мая prev_revenue будет мартовской — LAG считает строки, а не календарь."}, {"id": "b11", "level": 3, "title": "Накопленная выручка", "text": "month, revenue и cum_revenue — накопленная выручка с начала года по оплаченным заказам.", "ref": "WITH m AS (SELECT strftime('%Y-%m', order_date) AS month, SUM(amount) AS revenue FROM fact_orders WHERE status = 'paid' GROUP BY month) SELECT month, revenue, SUM(revenue) OVER (ORDER BY month) AS cum_revenue FROM m ORDER BY month;", "ordered": true, "hint": "SUM(...) OVER (ORDER BY month)."}, {"id": "b12", "level": 3, "title": "Лидер в категории", "text": "Для каждой категории найдите товар с наибольшей выручкой по оплаченным заказам: category, name, revenue.", "ref": "SELECT category, name, revenue FROM (SELECT p.category, p.name, SUM(o.amount) AS revenue, ROW_NUMBER() OVER (PARTITION BY p.category ORDER BY SUM(o.amount) DESC) AS rn FROM fact_orders o JOIN dim_product p ON p.product_id = o.product_id WHERE o.status = 'paid' GROUP BY p.category, p.name) t WHERE rn = 1;", "ordered": false, "hint": "Агрегат по товару + ROW_NUMBER по категории в одном подзапросе, rn = 1 снаружи."}, {"id": "b13", "level": 3, "title": "Доля категории в месяце", "text": "Для каждого месяца и категории: month, category, share — доля категории в выручке месяца (оплаченные заказы), 3 знака после запятой.", "ref": "SELECT month, category, ROUND(1.0 * revenue / SUM(revenue) OVER (PARTITION BY month), 3) AS share FROM (SELECT strftime('%Y-%m', o.order_date) AS month, p.category, SUM(o.amount) AS revenue FROM fact_orders o JOIN dim_product p ON p.product_id = o.product_id WHERE o.status = 'paid' GROUP BY month, p.category) t;", "ordered": false, "hint": "Сначала выручка по месяцу и категории, затем деление на SUM() OVER (PARTITION BY month). Умножьте на 1.0, иначе деление целочисленное."}, {"id": "b14", "level": 3, "title": "Витрина «месяц × регион»", "text": "Соберите витрину по оплаченным заказам: month, region, orders (число заказов), customers (уникальные клиенты), revenue.", "ref": "SELECT strftime('%Y-%m', o.order_date) AS month, c.region, COUNT(*) AS orders, COUNT(DISTINCT o.customer_id) AS customers, SUM(o.amount) AS revenue FROM fact_orders o JOIN dim_customer c ON c.customer_id = o.customer_id WHERE o.status = 'paid' GROUP BY month, c.region;", "ordered": false, "hint": "Типичная агрегированная витрина под дашборд: два измерения и три меры."}, {"id": "b15", "level": 3, "title": "Доля отмен по месяцам", "text": "Для каждого месяца: month и cancel_rate — доля заказов со статусом cancelled от всех заказов месяца, 3 знака.", "ref": "SELECT strftime('%Y-%m', order_date) AS month, ROUND(AVG(CASE WHEN status = 'cancelled' THEN 1.0 ELSE 0 END), 3) AS cancel_rate FROM fact_orders GROUP BY month;", "ordered": false, "hint": "AVG от флага CASE WHEN … THEN 1 ELSE 0 — это и есть доля."}]};

<script>
/* Question generators: each returns {topic, kind, text, html, options, correct, expl, time} */
const R = {
  int(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  sample(arr, k) { return R.shuffle(arr).slice(0, k); }
};
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function frac(n, d) { const g = gcd(n, d) || 1; n /= g; d /= g; return d === 1 ? String(n) : n + '/' + d; }
function dec(x, d = 2) { let s = (Math.round(x * 10 ** d) / 10 ** d).toFixed(d); if (d > 0) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s.replace('.', ','); }
function decFixed(x, d) { return (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace('.', ','); }
function C(n, k) { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
function A(n, k) { let r = 1; for (let i = 0; i < k; i++) r *= (n - i); return r; }
function fact(n) { return n <= 1 ? 1 : n * fact(n - 1); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function plural(n, one, few, many) { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few; return many; }

function single(o) {
  const correct = String(o.correct);
  const uniq = [];
  for (const w of o.wrong.map(String)) if (w !== correct && !uniq.includes(w)) uniq.push(w);
  const num = Number(correct.replace(',', '.'));
  for (let k = 1; uniq.length < (o.n || 4) - 1 && k < 20; k++) {
    if (!Number.isFinite(num)) break;
    for (const c of [num + k, num - k]) { const v = String(c).replace('.', ','); if (c >= 0 && v !== correct && !uniq.includes(v) && uniq.length < (o.n || 4) - 1) uniq.push(v); }
  }
  const opts = R.shuffle([correct, ...uniq.slice(0, (o.n || 4) - 1)]);
  return { topic: o.topic, kind: 'single', text: o.text, html: o.html || '', code: !!o.code, options: opts, correct: [opts.indexOf(correct)], expl: o.expl, time: o.time || 60 };
}
function multi(o) {
  let st = o.statements.slice();
  if (o.pickN) {
    for (let tries = 0; tries < 50; tries++) {
      const s = R.sample(o.statements, o.pickN);
      if (s.some(x => x.ok) && s.some(x => !x.ok)) { st = s; break; }
    }
  }
  st = o.keepOrder ? st : R.shuffle(st);
  return { topic: o.topic, kind: 'multi', text: o.text, html: o.html || '', code: !!o.code, options: st.map(s => s.t), correct: st.map((s, i) => s.ok ? i : -1).filter(i => i >= 0), expl: o.expl + (o.why ? '' : '') + '<ul class="why">' + st.map(s => `<li><b>${s.ok ? 'Верно' : 'Неверно'}:</b> ${esc(s.t)}${s.why ? ' — ' + s.why : ''}</li>`).join('') + '</ul>', time: o.time || 120 };
}
function bank(topic, items) {
  return () => {
    const it = R.pick(items);
    if (it.statements) return multi({ topic, text: it.q, html: it.html, statements: it.statements, pickN: it.pickN || 4, expl: it.expl || '', time: it.time || 120 });
    return single({ topic, text: it.q, html: it.html, correct: it.a, wrong: it.w, expl: it.expl, time: it.time || 60, code: it.code });
  };
}

const G = {};

/* ================= SVG charts ================= */
const PAL = ['#3A7BD5', '#E07B39', '#2E9E6A', '#9A63D3', '#D1495B', '#C79A1E', '#1FA3A8', '#8C6D5A', '#D45FA0', '#6C7A89'];
const SIMILAR = ['#86C06F', '#5B9DDB', '#4F9E46', '#3C6FBA'];
const CHW = 540, CHH = 300;
function yMap(v, o, top, h) { return top + h * (1 - (v - o.yMin) / (o.yMax - o.yMin)); }
function chartFrame(o, inner) {
  const t = o.title ? `<text class="ch-title" x="${CHW / 2}" y="20" text-anchor="middle">${esc(o.title)}</text>` : '';
  return `<figure class="chart"><svg viewBox="0 0 ${CHW} ${o.h || CHH}" role="img" aria-label="${esc(o.title || 'график')}">${t}${inner}</svg></figure>`;
}
function yAxis(o, L, T, W, H) {
  let s = '';
  if (o.tickLabels) {
    o.tickLabels.forEach((lab, i) => { const y = T + H * (i + 0.5) / o.tickLabels.length; s += `<text class="ch-txt" x="${L - 6}" y="${y + 3}" text-anchor="end">${esc(lab)}</text>`; });
  } else if (!o.noTicks) {
    for (const v of o.ticks) { const y = yMap(v, o, T, H); s += `<line class="ch-grid" x1="${L}" x2="${L + W}" y1="${y}" y2="${y}"/><text class="ch-txt" x="${L - 6}" y="${y + 3}" text-anchor="end">${v}</text>`; }
  }
  s += `<line class="ch-axis" x1="${L}" x2="${L}" y1="${T}" y2="${T + H}"/><line class="ch-axis" x1="${L}" x2="${L + W}" y1="${T + H}" y2="${T + H}"/>`;
  if (o.yLabel) s += `<text class="ch-txt" transform="translate(12 ${T + H / 2}) rotate(-90)" text-anchor="middle">${esc(o.yLabel)}</text>`;
  if (o.xLabel) s += `<text class="ch-txt" x="${L + W / 2}" y="${(o.h || CHH) - 4}" text-anchor="middle">${esc(o.xLabel)}</text>`;
  return s;
}
function lineChart(o) {
  const L = 56, T = 34, W = CHW - L - 20, H = (o.h || CHH) - T - 44;
  let s = yAxis(o, L, T, W, H);
  const n = o.xs.length, x = i => L + W * (i + 0.5) / n;
  s += `<polyline class="ch-line" points="${o.ys.map((v, i) => `${x(i)},${yMap(v, o, T, H)}`).join(' ')}"/>`;
  o.ys.forEach((v, i) => { s += `<circle class="ch-dot" cx="${x(i)}" cy="${yMap(v, o, T, H)}" r="3"/>`; if (o.values) s += `<text class="ch-val" x="${x(i)}" y="${yMap(v, o, T, H) - 8}" text-anchor="middle">${v}</text>`; });
  o.xs.forEach((c, i) => { s += `<text class="ch-txt" x="${x(i)}" y="${T + H + 16}" text-anchor="middle">${esc(c)}</text>`; });
  return chartFrame(o, s);
}
function barChart(o) {
  const L = o.tickLabels ? 84 : 56, T = 34, W = CHW - L - 20, H = (o.h || CHH) - T - 44;
  let s = yAxis(o, L, T, W, H);
  const n = o.cats.length, bw = W / n * 0.62;
  o.vals.forEach((v, i) => {
    const cx = L + W * (i + 0.5) / n, y = yMap(Math.max(v, o.yMin), o, T, H), base = T + H;
    const col = Array.isArray(o.colors) ? o.colors[i % o.colors.length] : (o.colors || PAL[0]);
    s += `<rect x="${cx - bw / 2}" y="${Math.min(y, base)}" width="${bw}" height="${Math.abs(base - y)}" fill="${col}" rx="2"/>`;
    if (o.values) s += `<text class="ch-val" x="${cx}" y="${y - 6}" text-anchor="middle">${v}</text>`;
    s += `<text class="ch-txt" x="${cx}" y="${T + H + 16}" text-anchor="middle">${esc(o.cats[i])}</text>`;
  });
  return chartFrame(o, s);
}
function stackedChart(o) {
  const L = 56, T = 34, legendW = o.legend === false ? 0 : 84, W = CHW - L - 16 - legendW, H = (o.h || CHH) - T - 44;
  let s = yAxis(o, L, T, W, H);
  const n = o.cats.length, bw = W / n * 0.62;
  o.cats.forEach((c, i) => {
    const cx = L + W * (i + 0.5) / n; let acc = 0;
    o.series.forEach((sr, k) => {
      const v = sr.vals[i], y0 = yMap(acc, o, T, H), y1 = yMap(acc + v, o, T, H); acc += v;
      s += `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${y0 - y1}" fill="${sr.color}" stroke="var(--card)" stroke-width="0.6"/>`;
      if (o.segLabel) { const lines = o.segLabel(sr, i, k); const mid = (y0 + y1) / 2 - (lines.length - 1) * 4.5; lines.forEach((ln, j) => { s += `<text class="ch-seg" x="${cx}" y="${mid + j * 9 + 3}" text-anchor="middle">${esc(ln)}</text>`; }); }
    });
    s += `<text class="ch-txt" x="${cx}" y="${T + H + 16}" text-anchor="middle">${esc(c)}</text>`;
  });
  if (o.legend !== false) {
    o.series.slice().reverse().forEach((sr, k) => { const y = T + H / 2 - o.series.length * 8 + k * 16; s += `<rect x="${L + W + 14}" y="${y - 8}" width="10" height="10" fill="${sr.color}"/><text class="ch-txt" x="${L + W + 28}" y="${y + 1}">${esc(sr.name)}</text>`; });
  }
  return chartFrame(o, s);
}
function pieChart(o) {
  const cx = 170, cy = 165, r = 110, tot = o.vals.reduce((a, b) => a + b, 0); let a0 = -Math.PI / 2, s = '';
  o.vals.forEach((v, i) => {
    const a1 = a0 + 2 * Math.PI * v / tot, large = a1 - a0 > Math.PI ? 1 : 0;
    s += `<path d="M${cx},${cy} L${cx + r * Math.cos(a0)},${cy + r * Math.sin(a0)} A${r},${r} 0 ${large} 1 ${cx + r * Math.cos(a1)},${cy + r * Math.sin(a1)} Z" fill="${PAL[i % PAL.length]}" stroke="var(--card)" stroke-width="1"/>`;
    a0 = a1;
  });
  o.labels.forEach((l, i) => { const y = 50 + i * 20; s += `<rect x="330" y="${y - 9}" width="10" height="10" fill="${PAL[i % PAL.length]}"/><text class="ch-txt" x="346" y="${y}">${esc(l)}</text>`; });
  return chartFrame(Object.assign({ h: 300 }, o), s);
}
function dataTable(head, rows) { return `<div class="tablewrap"><table class="mini"><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`; }
function sqlBlock(s) { return `<pre class="code">${esc(s)}</pre>`; }

/* ================= SQL для BI ================= */
G.sDedup = () => multi({ topic: 'sql', text: 'Что из перечисленного является актуальным способом дедупликации пар (customer_id, product_id) в таблице sales?', pickN: 4, time: 150, code: true, expl: '',
  statements: [
    { t: 'SELECT DISTINCT customer_id, product_id FROM sales;', ok: true, why: 'классический способ убрать дубли' },
    { t: 'SELECT customer_id, product_id FROM sales GROUP BY customer_id, product_id;', ok: true, why: 'группировка тоже оставляет уникальные пары' },
    { t: 'SELECT * FROM sales WHERE ROW_NUMBER() OVER (PARTITION BY customer_id, product_id ORDER BY order_date) = 1;', ok: false, why: 'оконные функции нельзя использовать в WHERE — нужен подзапрос или CTE' },
    { t: 'SELECT UNIQUE customer_id, product_id FROM sales;', ok: false, why: 'устаревший синоним DISTINCT только в Oracle, не стандарт' },
    { t: 'SELECT * FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY customer_id, product_id ORDER BY order_date) AS rn FROM sales) t WHERE rn = 1;', ok: true, why: 'правильный способ оставить первую строку каждой пары' },
    { t: 'SELECT DISTINCT ON (customer_id, product_id) * FROM sales ORDER BY customer_id, product_id, order_date;', ok: true, why: 'работает в PostgreSQL' },
    { t: 'SELECT customer_id, product_id FROM sales HAVING COUNT(*) = 1;', ok: false, why: 'без GROUP BY это не работает, а с ним отбросит пары с дублями целиком' }
  ] });
G.sJoinResult = () => {
  const kind = R.pick(['LEFT', 'INNER', 'RIGHT']);

  const ans = { LEFT: 'Все клиенты будут отображены, даже если у них нет заказов', INNER: 'Только клиенты с заказами будут отображены', RIGHT: 'Все заказы будут отображены, даже без найденного клиента' }[kind];

    expl: `${kind} JOIN: ${kind === 'LEFT' ? 'все строки customers, у клиентов без заказов order_id = NULL' : kind === 'INNER' ? 'только пары с совпадением' : 'все строки orders'}. Клиент с несколькими заказами повторится столько раз, сколько у него заказов — JOIN не схлопывает строки.`, time: 120 });
};
G.sOrder = () => multi({ topic: 'sql', text: 'Выберите все правильные утверждения о логическом порядке выполнения SQL-запроса', html: sqlBlock('SELECT name, COUNT(*) AS project_count\nFROM employees e\nJOIN projects p ON e.id = p.employee_id\nWHERE e.salary > 50000\nGROUP BY name\nHAVING COUNT(*) > 3\nORDER BY project_count DESC;'), pickN: 4, time: 120, expl: 'Порядок: FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.',
  statements: [
    { t: 'JOIN объединяет таблицы до применения фильтра WHERE', ok: true },
    { t: 'WHERE фильтрует агрегированные данные после GROUP BY', ok: false, why: 'WHERE работает до группировки и не видит агрегатов' },
    { t: 'HAVING фильтрует данные после применения GROUP BY', ok: true },
    { t: 'SELECT выполняется до WHERE', ok: false, why: 'поэтому алиас из SELECT нельзя использовать в WHERE' },
    { t: 'ORDER BY может использовать алиас project_count', ok: true, why: 'ORDER BY выполняется после SELECT' },

G.sGroupValid = () => {

G.sLag = () => {
  const y = R.pick([2024, 2025]);
  const startM = 0, endM = R.int(5, 11);
  let present = []; for (let m = startM; m <= endM; m++) present.push(m);
  const gap = R.int(1, endM - 1); if (Math.random() < 0.7) present = present.filter(m => m !== gap);
  const rev = present.map(() => R.int(10, 99) * 10);
  const fn = R.pick(['LAG', 'LAG', 'LEAD']), k = R.pick([1, 1, 2, 3, 12]);
  const ti = R.int(0, present.length - 1), target = present[ti];
  const j = fn === 'LAG' ? ti - k : ti + k;
  const ans = j >= 0 && j < present.length ? String(rev[j]) : 'NULL';
  const calM = fn === 'LAG' ? target - k : target + k, calIdx = present.indexOf(calM);
  const trap = calIdx >= 0 ? String(rev[calIdx]) : '0';
  const fmt = m => `${y}-${String(m + 1).padStart(2, '0')}-01`;
  const html = sqlBlock(`SELECT month, revenue,\n       ${fn}(revenue, ${k}) OVER (ORDER BY month) AS v\nFROM monthly_revenue;`) + `<p class="qtype">monthly_revenue — по строке на месяц, где были транзакции:</p>` + dataTable(['month', 'revenue'], present.map((m, i) => [fmt(m), rev[i]]));
  return single({ topic: 'sql', text: `Каким будет значение v для строки ${fmt(target)}?`, html,
    correct: ans, wrong: ['NULL', '0', trap, String(rev[Math.min(ti + 1, present.length - 1)]), String(rev[0]), String(rev.slice(0, ti).reduce((a, b) => a + b, 0)), String(rev[ti]), String(rev[rev.length - 1])],
    expl: `${fn}(x, ${k}) берёт значение на ${k} ${plural(k, 'строку', 'строки', 'строк')} ${fn === 'LAG' ? 'выше' : 'ниже'} по порядку ORDER BY — считаются строки, а не календарные месяцы. ${present.length < endM - startM + 1 ? `Месяца ${fmt(gap)} в таблице нет, поэтому сдвиг через него «перепрыгивает». ` : ''}Если строки не существует — NULL (0 был бы только с третьим аргументом по умолчанию). Ответ: <b>${ans}</b>. В исходном тесте LAG(revenue, 12) для мая 2024 при данных с начала 2024 — тоже NULL.`, time: 180 });

function quarterStack(similar) {
  const regions = ['Восток', 'Запад', 'Юг', 'Север'];
  const cols = similar ? [SIMILAR[3], SIMILAR[2], SIMILAR[1], SIMILAR[0]] : [PAL[0], PAL[1], PAL[2], PAL[3]];
  return { regions, series: regions.map((r, k) => ({ name: r, color: cols[k], vals: [0, 1, 2, 3].map(() => R.int(6, 18) * 10) })) };
}

const KEY = 'avito-bi-trainer-v1';

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
function record(topic, ok, secs) {
  (S.stats[topic] = S.stats[topic] || []).push({ ok: ok ? 1 : 0, t: Math.round(secs) });
  if (S.stats[topic].length > 40) S.stats[topic] = S.stats[topic].slice(-40);
  save();
}
function topicStat(t) {

  wrap.keyHandler = e => {
    if (answered) { if (e.key === 'Enter') { const n = $('.next', wrap); if (n) { e.preventDefault(); n.click(); } } return; }
    const k = +e.key;

  }, 250);
  return wrap;
}

function weightedTopic() {
  const ts = Object.keys(TOPICS);
  const w = ts.map(t => { const st = topicStat(t); return st.n < 5 ? 3 : 1 + 3 * (1 - st.acc); });
  let r = Math.random() * w.reduce((a, b) => a + b);
  for (let i = 0; i < ts.length; i++) { r -= w[i]; if (r <= 0) return ts[i]; }

  ['dim_product', 'product_id, name, category, price', '12 товаров, один ни разу не продавался'],
  ['raw_events', 'event_id, user_id, event_type, event_ts', 'сырые события с полными дублями строк']
];
function renderSql() {
  const el = $('#v-sql');
  el.innerHTML = `
    <div class="viewhead"><h2>SQL-песочница</h2><p class="muted">Настоящая база SQLite в браузере со схемой «звезда»: факт заказов и измерения. Пиши запрос, запускай (Ctrl+Enter) и проверяй: результат сравнивается с эталоном по значениям, имена столбцов не важны. Даты в SQLite — strftime('%Y-%m', дата) вместо DATE_TRUNC.</p></div>
    <details class="schema"><summary>Схема базы</summary><div class="tablewrap"><table class="data"><tr><th>Таблица</th><th>Столбцы</th><th>Что внутри</th></tr>${SCHEMA.map(s => `<tr><td class="mono">${s[0]}</td><td class="mono">${s[1]}</td><td>${s[2]}</td></tr>`).join('')}</table></div></details>
    <div class="split"><nav class="side" id="sqllist" aria-label="Задачи"></nav><div id="sqlhost" class="minw"></div></div>`;
  renderSqlList(); openSqlTask(sqlTask);
}
function renderSqlList() {
  const l = $('#sqllist'); if (!l) return;
  const lv = ['', 'база', 'средне', 'сложнее'];
  l.innerHTML = SQLDATA.tasks.map((t, i) => `<button class="side-item" aria-current="${t.id === sqlTask}" data-sq="${t.id}"><span>${i + 1}. ${t.title}<small class="muted"> · ${lv[t.level]}</small></span>${S.sqlDone[t.id] ? '<span class="pill good">решено</span>' : ''}</button>`).join('');
  $$('[data-sq]', l).forEach(b => b.onclick = () => { sqlTask = b.dataset.sq; renderSqlList(); openSqlTask(sqlTask); });
}
function openSqlTask(id) {
  const t = SQLDATA.tasks.find(x => x.id === id), host = $('#sqlhost');
  host.innerHTML = `
    <div class="codecard sqlcard">
      <h3>${t.title}</h3>
      <p>${esc(t.text)}</p>
      <textarea class="editor sql" id="sqled-${t.id}" spellcheck="false" autocapitalize="off">${esc(S.sqlCode[t.id] || 'SELECT * FROM fact_orders LIMIT 5;')}</textarea>
      <div class="row gap wrap"><button class="btn run">▶ Выполнить</button><button class="btn primary check">Проверить</button><button class="btn ghost hintb">Подсказка</button><button class="btn ghost sol">Решение</button></div>
      <div class="sqlmsg" aria-live="polite"></div>
      <div class="sqlout"></div>
    </div>`;
  const ed = $('textarea', host), msg = $('.sqlmsg', host), out = $('.sqlout', host);
  ed.addEventListener('input', () => { S.sqlCode[t.id] = ed.value; save(); });
  ed.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('.run', host).click(); } if (e.key === 'Tab') { e.preventDefault(); const s = ed.selectionStart; ed.value = ed.value.slice(0, s) + '  ' + ed.value.slice(ed.selectionEnd); ed.selectionStart = ed.selectionEnd = s + 2; } });
  async function exec(check) {
    msg.innerHTML = '<p class="muted">Загружаю SQLite…</p>';
    try { await ensureSql(); } catch (e) { msg.innerHTML = '<p class="verdict no">Не удалось загрузить SQLite. Проверьте подключение к интернету.</p>'; return; }
    const db = freshDb();
    let r;
    try { r = lastResult(db, ed.value); } catch (e) { msg.innerHTML = `<p class="verdict no">Ошибка SQL</p><pre class="err">${esc(e.message)}</pre>`; out.innerHTML = ''; db.close(); return; }
    out.innerHTML = tableHtml(r);
    if (check) {
      const ref = lastResult(db, t.ref);
      const diff = sameResult(r, ref, t.ordered);
      if (!diff) { msg.innerHTML = '<p class="verdict ok">Верно — результат совпадает с эталоном.</p>'; S.sqlDone[t.id] = true; save(); renderSqlList(); }
      else msg.innerHTML = `<p class="verdict no">Пока не совпадает. ${esc(diff)}</p><details><summary>Ожидаемый результат</summary>${tableHtml(ref, 20)}</details>`;
    } else msg.innerHTML = '';
    db.close();
  }
  $('.run', host).onclick = () => exec(false);
  $('.check', host).onclick = () => exec(true);
  $('.hintb', host).onclick = () => { msg.innerHTML = `<p class="note">${esc(t.hint)}</p>`; };
  $('.sol', host).onclick = () => { msg.innerHTML = `<p class="olabel">Эталонный запрос</p><pre class="code">${esc(t.ref)}</pre>`; };
}

/* ================= exam ================= */
const EXAM_BLOCKS = [
  { name: 'SQL', from: 0, to: 6 },
  { name: 'Выбор графика', from: 7, to: 9 },
  { name: 'Критика графиков', from: 10, to: 19 }
];
const CODE_TIME = 300;
const EX = { running: false, items: [], i: 0, results: [], t0: 0 };
function buildExam() {
  const seen = new Set();
  return EXAM_LAYOUT.map(g => {
    for (let k = 0; k < 40; k++) { const q = G[g](); if (!seen.has(q.text + q.html)) { seen.add(q.text + q.html); return q; } }
    return G[g]();
  });
}
function renderExam() {
  const el = $('#v-exam');
  if (EX.running) { showExamItem(); return; }
  const last = S.exams[S.exams.length - 1];
  el.innerHTML = `
    <div class="examstart">
      <p class="eyebrow">Генеральная репетиция</p>
      <h2>Пробный тест: 20 задач</h2>
      <p class="lead">Структура как в присланном тесте: 7 задач по SQL, 3 на выбор визуализации, 10 на разбор графиков. У каждой задачи свой таймер; вернуться к предыдущей нельзя. Когда время выходит, ответ отправляется автоматически.</p>
      <ul class="facts"><li><b>~35 мин</b> на весь тест</li><li><b>1,5–4 мин</b> на задачу по SQL</li><li><b>1–2 мин</b> на график</li><li><b>18/20</b> — целевой результат</li></ul>
      <p class="note">Задачи каждый раз новые.${last ? ` Прошлый результат: ${last.score}/20.` : ''}</p>
      <button class="btn primary big" id="exam-go">Начать тест</button>
      <p class="examload muted" aria-live="polite"></p>
    </div>`;
  $('#exam-go').onclick = () => {
    Object.assign(EX, { running: true, items: buildExam(), i: 0, results: [], t0: performance.now() });
    showExamItem();
  };
}
function examProgress() { return `<div class="eprog"><span>Задание ${EX.i + 1} из 20</span><span class="ebar"><span style="width:${(EX.i / 20) * 100}%"></span></span><button class="link" id="exam-quit">Завершить досрочно</button></div><div class="leave" id="exam-leave" hidden>Тест прервётся, результат не сохранится. <button class="link danger" id="leave-yes">Выйти из теста</button> <button class="link" id="leave-no">Продолжить тест</button></div>`; }
function showExamLeave() { const l = $('#exam-leave'); if (l) l.hidden = false; }
function bindLeave() {
  $('#exam-quit').onclick = () => { EX.pendingNav = null; showExamLeave(); };
  $('#leave-no').onclick = () => { $('#exam-leave').hidden = true; EX.pendingNav = null; };
  $('#leave-yes').onclick = () => { EX.running = false; stopTimer(); const p = EX.pendingNav; EX.pendingNav = null; if (p) go(p.view, p.opts); else renderExam(); };
}
function showExamItem() {
  const el = $('#v-exam');
  if (EX.i >= EX.items.length) return finishExam();
  const it = EX.items[EX.i];
  el.innerHTML = examProgress() + '<div id="ehost"></div>';
  bindLeave();
  const host = $('#ehost');
  const advance = () => { EX.i++; showExamItem(); };
  const card = questionCard(it, { label: `Задание ${EX.i + 1} из 20`, mode: 'exam', onAnswer: ({ ok, chosen, secs, timeout }) => {
    EX.results.push({ q: it, ok, chosen, secs, timeout });
    record(it.topic, ok, secs);
    if (!ok) addMistake(it);
    setTimeout(advance, timeout ? 600 : 250);
  } });
  $('.submit', card).textContent = 'Отправить ответ';
  host.appendChild(card); currentCard = card;
}
function finishExam() {
  EX.running = false; stopTimer(); currentCard = null;
  const secs = (performance.now() - EX.t0) / 1000;
  const score = EX.results.filter(r => r.ok).length;
  const blocks = EXAM_BLOCKS.map(b => EX.results.slice(b.from, b.to + 1).filter(r => r.ok).length);
  const d = new Date();
  S.exams.push({ date: d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), score, secs: Math.round(secs), blocks });
  if (S.exams.length > 30) S.exams.shift();
  save();
  const el = $('#v-exam');
  const verdict = score >= 18 ? 'Уровень цели — можно идти на тест.' : score >= 15 ? 'Близко к цели. Добери слабые блоки и повтори через день.' : 'Пока рано: пройди тренировки по слабым темам и повтори пробный тест.';
  el.innerHTML = `
    <div class="examres">
      <p class="eyebrow">Результат пробного теста</p>
      <div class="score"><span class="big">${score}</span><span class="of">/ 20</span></div>
      <p class="lead">${verdict} Время: ${mmss(secs)}.</p>
      <div class="tablewrap"><table class="data"><tr><th>Блок</th><th>Верно</th><th></th></tr>${EXAM_BLOCKS.map((b, i) => { const n = b.to - b.from + 1, r = blocks[i] / n; return `<tr><td>${b.name}</td><td>${blocks[i]}/${n}</td><td class="barcell"><span class="bar"><span class="${r >= 0.85 ? 'good' : r >= 0.7 ? 'mid' : 'bad'}" style="width:${r * 100}%"></span></span></td></tr>`; }).join('')}</table></div>
      <div class="row gap wrap"><button class="btn primary" id="exam-again">Пройти ещё раз</button><button class="btn" data-go="train" data-topic="mistakes">Разобрать ошибки</button><button class="btn ghost" data-go="plan">К плану</button></div>
      <h3 class="sec">Разбор</h3>
      <ol class="review">${EX.results.map((r, i) => `
        <li class="${r.ok ? 'ok' : 'no'}"><details><summary><span class="rnum">${i + 1}</span> ${r.ok ? 'Верно' : r.timeout ? 'Время вышло' : 'Неверно'} · ${esc(r.q.text.length > 90 ? r.q.text.slice(0, 90) + '…' : r.q.text)} · ${Math.round(r.secs)} с</summary>
        ${r.q.html || ''}<ul class="ans">${r.q.options.map((o, k) => `<li class="${r.q.correct.includes(k) ? 'right' : r.chosen.includes(k) ? 'wrong' : ''}">${esc(o)}${r.chosen.includes(k) ? ' <span class="muted">· ваш ответ</span>' : ''}</li>`).join('')}</ul><div class="expl">${r.q.expl}</div></details></li>`).join('')}</ol>
    </div>`;
  $('#exam-again').onclick = () => renderExam();
}

go((location.hash || '').replace('#', '') || 'plan');
